name: Publish VPM listing
on:
  workflow_dispatch:
  release:
    types: [published]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  listing:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Select all public releases
        shell: pwsh
        run: ./Tools/Prepare-VpmListing.ps1
      - name: Build complete listing
        shell: pwsh
        run: ./Tools/Build-VpmListing.ps1
      - name: Verify complete version list
        shell: pwsh
        run: ./Tools/Test-VpmListing.ps1
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .artifacts/site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
